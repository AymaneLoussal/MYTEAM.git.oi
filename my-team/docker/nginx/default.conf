server { listen 8080; server_name _; server_tokens off; root /app/public; index index.php; client_max_body_size 16m;
 add_header X-Content-Type-Options "nosniff" always;
 add_header X-Frame-Options "SAMEORIGIN" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 location / { try_files $uri $uri/ /index.php?$query_string; }
 location ~ \.php$ { try_files $uri =404; fastcgi_pass 127.0.0.1:9000; include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; }
 location ~ /\.(?!well-known).* { deny all; }
}
